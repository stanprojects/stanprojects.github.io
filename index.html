<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>stanprojects</title>
    <link rel="stylesheet" href="./src/main/css/fonts.css">
    <link rel="stylesheet" href="./src/main/css/values.css">
    <link rel="stylesheet" href="./src/main/css/main.css">
    <link rel="stylesheet" href="./src/main/css/foundation.css">
    <link rel="stylesheet" href="./src/main/css/tables.css">
    <link rel="stylesheet" href="./src/main/css/styles.css">
    <link rel="icon">
    <meta name="version" content="0.0.2">
</head>
<body>
<div class="FlexBox" style="width: 100%; height: 100%; flex-direction: column;">
    <div id="TopBar" class="FlexBox" style="width: 100%; height: 64px; padding: 0 16px; align-items: center;">
        <div id="MenuSwitch" class="Box Clickable MenuSwitch">
            <div class="Icon" style="width: 24px; height: 24px; background-color: var(--colors-text);"></div>
        </div>
        <div id="ModuleTitle" class="Box ModuleTitle" style="flex: 1;"></div>
        <div id="ColorsSwitch" class="Box Clickable ColorsSwitch"></div>
    </div>
    <div style="width: 100%; box-sizing: border-box;">
        <div style="width: 100%; height: 1px; background-color: var(--colors-border);"></div>
    </div>
    <div class="Box" style="width: 100%; flex: 1;">
        <div id="ModuleScreen" class="Box ModuleScreen" style="height: 100%; width: 100%; min-height: 0; overflow-y: auto; scrollbar-width: auto;"></div>
        <div id="Scrim" class="Box Scrim" style="height: 100%; width: 100%;"></div>
        <div id="StartBar" class="FlexBox StartBar" style="height: 100%;">
            <div id="Modules" class="FlexBox Modules" style="height: 100%; flex: 1;"></div>
            <div style="height: 100%; box-sizing: border-box;">
                <div style="width: 1px; height: 100%; background-color: var(--colors-border);"></div>
            </div>
        </div>
    </div>
</div>
<script src="./src/main/js/main.js"></script>
</body>
</html>
